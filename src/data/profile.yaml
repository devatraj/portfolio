# Long-form case studies. Source: milanSathi repo docs (PROJECT_STATUS, pitch brief)
# and the JsProfile integration commits. Public-safe: no code, endpoints, data or vendor name.
case_studies:
  milansathi:
    title: milanSathi
    summary: An in-house AI-powered astrology engine that replaced a paid third-party API on Jeevansathi.
    facts: [milansathi, milansathi-parity, milansathi-vendor-bug, milansathi-honesty, milansathi-ai, milansathi-rollout]
    problem:
      - Every kundli and match was a paid call, so cost grew with traffic.
      - The vendor rate-limited us under load.
      - If the vendor went down, our astrology features went down with it.
      - Users' birth details were sent to a third party.
      - Any error in the vendor's scoring flowed straight into our match scores.
      - Some features we needed were blocked by the vendor's plan.
    approach:
      - title: Start from astronomy, not from the vendor
        text: Planet positions come from Swiss Ephemeris, the same astronomical data the industry uses, with the Lahiri ayanamsa that India's calendar standard uses. Anything that is pure astronomy is computed from first principles.
      - title: Match the vendor only where the vendor is right
        text: Traditional tables (koota scores, classifications) were cross-checked against classical sources and against the vendor. Where they disagreed, the classical method wins and the vendor's behaviour stays available behind a switch.
      - title: Be honest about what kind of answer each value is
        text: Every value is labelled Type-1 (provable astronomy), Type-2 (classical standard) or Type-3 (varies by tradition). Users and reviewers can see which numbers are facts and which are conventions.
      - title: Make the switch boring
        text: A score endpoint returns exactly the shape the vendor returned, so a caller changes only a URL. In the main profile service it went live behind an experiment flag, with automatic fallback to the vendor on failure.
