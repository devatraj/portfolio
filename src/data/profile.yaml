# What Devatraj can do. Each capability gets its own page: promise, proof, a tool to try.
capabilities:
  - slug: cut-costs
    title: Replace what you pay for
    short: Cut vendor bills
    promise: If a vendor bill grows with your traffic, I build the in-house version and prove it gives the same answers before you switch.
    for: Founders, CTOs and engineering managers with a vendor bill that keeps growing.
    problems:
      - Per-call pricing that grows with every new user.
      - Rate limits and outages you can't do anything about.
      - Your users' data leaving your systems.
      - Features locked behind a higher plan.
    proof: [milansathi, firebase-replacement, milansathi-parity]
    headline_metric: ["$115K", "a year saved across two replacements"]
    steps:
      - title: Inventory what you really use
        text: Most teams use a fraction of what they pay for. That fraction is all we rebuild.
      - title: Build it in-house
        text: Same contract, so the rest of your code barely notices.
      - title: Prove it matches
        text: Check it against the vendor on real data before any traffic moves.
      - title: Switch safely
        text: Roll out behind a flag, with automatic fallback to the vendor.
  - slug: llm-cost
    title: Make AI cheaper and faster
    short: Lower LLM costs
    promise: Most LLM bills pay for the same answer many times over. I cut repeat calls with semantic caching and keep answers reliable with fallbacks.
    for: Product teams whose AI feature works, but costs too much or answers too slowly.
    problems:
      - Similar questions each trigger a full, paid model call.
      - Slow answers in real-time flows like chat.
      - One model provider is a single point of failure.
    proof: [semantic-cache, genai-matchmaking, milansathi-ai]
    headline_metric: ["85%", "of LLM calls served from cache in production"]
    steps:
      - title: Measure the repeats
        text: Find how many requests are near-duplicates of earlier ones.
      - title: Cache by meaning
        text: Match new requests to past answers by embedding similarity, not exact text.
      - title: Route across models
        text: Use the cheapest model that is good enough, with a fallback when one fails.
  - slug: ai-features
    title: Ship AI features people use
    short: AI inside your product
    promise: AI that sits inside your product's main flow, where it moves a metric, not a chatbot bolted on the side.
    for: Product managers and founders who want AI to change a number, not just a demo.
    problems:
      - AI demos that never reach production.
      - Features users try once and ignore.
      - LLM output that breaks your UI because it isn't structured.
    proof: [chat-suggestions, structured-outputs, genai-matchmaking]
    headline_metric: ["35%", "more conversions from one LLM feature"]
    steps:
      - title: Pick the moment
        text: Find the step in your funnel where people stall.
      - title: Ground it in your data
        text: Generate from the user's real context, with structured output your app can trust.
      - title: A/B test it
        text: Ship to a share of users and keep it only if the metric moves.
  - slug: scale
    title: Backends that hold up
    short: Systems that scale
    promise: Event-driven backends that keep working when traffic spikes or a server dies.
    for: Engineering leaders hiring for backend and platform work.
    problems:
      - Services that slow down or fall over at peak traffic.
      - One failure cascading across the system.
      - Config or behaviour changes that need a deploy.
    proof: [firebase-replacement, kafka-matching, genai-matchmaking, api-aggregator, microservices-footprint]
    headline_metric: ["10M+", "requests a day on a platform I built"]
    steps:
      - title: Decouple with events
        text: Services talk through Kafka or RabbitMQ, so one slow consumer doesn't block the rest.
      - title: Cache what's hot
        text: Redis and ETags keep repeat reads off the database.
      - title: Fail safe
        text: Every dependency has a timeout and a fallback.
  - slug: agents-tools
    title: AI agents and internal tools
    short: Agents & tools
    promise: Tools your team uses every day, grounded in your own data, with sources, and honest about what they don't know.
    for: Teams buried in repetitive work, and anyone who wants an assistant that knows their codebase or documents.
    problems:
      - Knowledge stuck in a few people's heads.
      - AI tools that make things up confidently.
      - Repetitive work nobody has time to automate.
    proof: [resume-tailor, ai-code-reviewer, sutra]
    headline_metric: ["100%", "citation accuracy in my code reviewer's evals"]
    steps:
      - title: Ground it
        text: Retrieve from your own docs and code, and cite every answer.
      - title: Check itself
        text: A critic step verifies sources exist before the answer reaches you.
      - title: Keep it safe
        text: Read-only by default, with nothing leaving your systems that shouldn't.

# How Devatraj works. Taken from the standing rules he wrote for the milanSathi repo.
principles:
  - title: Read before building
    text: Understand the existing code and reuse its patterns before writing anything new.
  - title: Prove it, don't trust it
    text: A replacement ships only after it's checked against the system it replaces, and against first principles where the old system is wrong.
  - title: Design before code
    text: Agree on the approach first. Code is the cheap part once the design is right.
  - title: Add, don't rewrite
    text: Leave working logic alone. New behaviour goes beside it, behind a flag, with a way back.

